<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>athreei</title>
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px 0;
      }
      p {
        font-size: 14px;
        color: #666;
        margin: 0;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        padding: 8px;
        background: #f0f0f0;
        border-radius: 4px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4caf50;
      }
      .status-dot.disconnected {
        background: #f44336;
      }
    </style>
  </head>
  <body>
    <h1>athreei</h1>
    <p>Connect AI apps to your browser</p>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Checking connection...</span>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
