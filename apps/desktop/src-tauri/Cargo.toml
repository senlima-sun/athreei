[package]
name = "aiii-desktop"
version = "0.1.0"
description = "aiii Desktop - Universal MCP Gateway"
authors = ["athreei"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "aiii_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled-full"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
nanoid = "0.4"

# Summarization
sha2 = "0.10"
hex = "0.4"

# MCP SDK
rmcp = { version = "0.12", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
async-trait = "0.1"
schemars = "1.0"

# HTTP server for SSE transport
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# HTTP client for sync
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Backup/restore
rmp-serde = "1.3"
flate2 = "1.0"

# File dialogs
tauri-plugin-dialog = "2.0"

[dev-dependencies]
tempfile = "3.13"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
