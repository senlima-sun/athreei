[package]
name = "aiii-desktop"
version = "0.1.0"
description = "aiii Desktop - Universal MCP Gateway"
authors = ["athreei"]
edition = "2021"
rust-version = "1.70"

[lib]
name = "aiii_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled-full"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
nanoid = "0.4"

# MCP SDK
rmcp = { version = "0.12", features = ["server", "macros", "transport-io"] }
async-trait = "0.1"
schemars = "0.8"

[dev-dependencies]
tempfile = "3.13"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
