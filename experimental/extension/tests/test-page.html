<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Permission Test</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
      }
      h1 {
        color: #111827;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin: 10px 10px 10px 0;
      }
      button:hover {
        background: #1d4ed8;
      }
      #result {
        margin-top: 20px;
        padding: 15px;
        background: #f3f4f6;
        border-radius: 8px;
        font-family: monospace;
        font-size: 14px;
        min-height: 50px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .scope-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 20px 0;
      }
      .scope-buttons button {
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <h1>athreei Permission Test Page</h1>
    <p>Click a button to trigger a permission request from the extension:</p>

    <div class="scope-buttons">
      <button id="request-read">Request Read</button>
      <button id="request-interact">Request Interact</button>
      <button id="request-navigate">Request Navigate</button>
      <button id="request-screenshot">Request Screenshot</button>
      <button id="request-execute">Request Execute</button>
      <button id="request-custom">Request Custom</button>
    </div>

    <h2>Response:</h2>
    <div id="result">Waiting for permission request...</div>

    <script>
      const resultDiv = document.getElementById("result")
      let lastRequestId = null

      // Listen for permission response from extension
      window.addEventListener("aiii:permission-response", (e) => {
        console.log("Received permission response:", e.detail)
        resultDiv.textContent = JSON.stringify(e.detail, null, 2)
        resultDiv.setAttribute("data-received", "true")
        resultDiv.setAttribute(
          "data-allowed",
          e.detail.allowed ? "true" : "false"
        )
      })

      // Listen for ready event
      window.addEventListener("aiii:ready", (e) => {
        console.log("Extension ready:", e.detail)
        const readyMsg = `Extension Ready!\nVersion: ${e.detail.version}\nCapabilities: ${e.detail.capabilities.join(", ")}`
        resultDiv.textContent = readyMsg
      })

      // Helper to dispatch permission request
      function requestPermission(scope, reason) {
        lastRequestId = "test-" + Date.now()
        console.log(`Requesting permission: ${scope} (${lastRequestId})`)

        resultDiv.textContent = `Requesting ${scope} permission...\nRequest ID: ${lastRequestId}`
        resultDiv.setAttribute("data-received", "false")

        window.dispatchEvent(
          new CustomEvent("aiii:permission", {
            detail: {
              scope: scope,
              reason: reason || `Test ${scope} permission request`,
              requestId: lastRequestId,
              duration: "session",
            },
          })
        )
      }

      // Wire up buttons
      document.getElementById("request-read").addEventListener("click", () => {
        requestPermission("read", "Read page content for analysis")
      })

      document
        .getElementById("request-interact")
        .addEventListener("click", () => {
          requestPermission("interact", "Click and type on page elements")
        })

      document
        .getElementById("request-navigate")
        .addEventListener("click", () => {
          requestPermission("navigate", "Navigate to different URLs")
        })

      document
        .getElementById("request-screenshot")
        .addEventListener("click", () => {
          requestPermission("screenshot", "Take screenshots of the page")
        })

      document
        .getElementById("request-execute")
        .addEventListener("click", () => {
          requestPermission("execute", "Execute JavaScript on the page")
        })

      document
        .getElementById("request-custom")
        .addEventListener("click", () => {
          requestPermission(
            "custom",
            "Use custom tools registered by the website"
          )
        })

      console.log("Permission test page loaded")
    </script>
  </body>
</html>
